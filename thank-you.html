<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Received — Collaged Prints</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .thanks {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 28px;
  }
  .thanks .stamp { margin-bottom: 24px; font-size: 0.9rem; }
  .thanks h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); margin-bottom: 18px; }
  .thanks p { max-width: 480px; color: var(--color-ink-soft); margin-bottom: 32px; }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="container">
    <a href="index.html" class="wordmark"><span class="wordmark-line1">Collaged</span> <span class="wordmark-line2">Prints</span></a>
    <ul class="links">
      <li class="nav-shop"><a href="shop.html">Print Shop</a></li>
      <li class="nav-cart"><a href="cart.html" class="cart-link">Cart <span class="cart-count" id="navCartCount">0</span></a></li>
    </ul>
  </div>
</nav>

<section class="thanks">
  <span class="stamp">Request received</span>
  <h1>Your order request<br>is in.</h1>
  <p>I've sent a confirmation to your email. I'll review your customization notes and follow up with your final price before printing.</p>
  <a href="shop.html" class="btn btn-cherry">Keep browsing</a>
</section>

<footer class="site-footer">
  <div class="container">
    <span>&copy; <span id="year"></span> Collaged Prints</span>
    <span>Made by Weezy</span>
  </div>
</footer>

<script src="js/cart.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
